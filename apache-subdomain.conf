# Apache Configuration for moverse.rydlr.com (Subdomain)
# Add this to your subdomain's Apache configuration

# In Virtualmin: moverse.rydlr.com → Server Configuration → Edit Directives
# Add this BEFORE the closing </VirtualHost> tag:

# Proxy all requests to Python API server
ProxyPass / http://localhost:8080/
ProxyPassReverse / http://localhost:8080/

# CORS Headers for all requests
Header always set Access-Control-Allow-Origin "*"
Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
Header always set Access-Control-Max-Age "3600"

# Handle OPTIONS preflight requests
RewriteEngine On
RewriteCond %{REQUEST_METHOD} OPTIONS
RewriteRule ^(.*)$ $1 [R=200,L]

# Allow access to all paths
<Location />
    Require all granted
</Location>

# Alternative: If using .htaccess in subdomain document root
# Place this in /home/rydlr/domains/moverse.rydlr.com/public_html/.htaccess

# .htaccess content for subdomain:
RewriteEngine On
RewriteRule ^(.*)$ http://localhost:8080/$1 [P,L]

<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
</IfModule>

RewriteCond %{REQUEST_METHOD} OPTIONS
RewriteRule ^(.*)$ - [R=200,L]

Options -Indexes +FollowSymLinks
Require all granted
