# Apache Configuration for www.rydlr.com/motionblend
# Add this to your main domain's Apache configuration

# In Virtualmin: www.rydlr.com → Server Configuration → Edit Directives
# Add this BEFORE the closing </VirtualHost> tag:

<Location /motionblend>
    # Proxy to Python API server
    ProxyPass http://localhost:8080
    ProxyPassReverse http://localhost:8080

    # CORS Headers
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header always set Access-Control-Max-Age "3600"

    # Allow access
    Require all granted
</Location>

# Handle OPTIONS preflight requests
RewriteEngine On
RewriteCond %{REQUEST_METHOD} OPTIONS
RewriteRule ^motionblend(/.*)?$ - [R=200,L]

# Alternative: If using .htaccess in /home/rydlr/public_html/.htaccess
# (This is what you should use instead of editing Apache config directly)

# .htaccess content for /home/rydlr/public_html/.htaccess:
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/motionblend(/.*)?$
RewriteRule ^(.*)$ http://localhost:8080/$1 [P,L]

<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "*" env=REQUEST_URI
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" env=REQUEST_URI
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" env=REQUEST_URI
</IfModule>

RewriteCond %{REQUEST_METHOD} OPTIONS
RewriteRule ^motionblend(/.*)?$ - [R=200,L]
