steps:
  # Build the API server container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/moverse-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/moverse-api:latest'
      - '-f'
      - 'Dockerfile.api'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/moverse-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/moverse-api:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'moverse-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/moverse-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GCS_BUCKET=motionblend-mocap,BQ_PROJECT=$PROJECT_ID,BQ_DATASET=RAW_DEV,ELASTICSEARCH_URL=https://my-elasticsearch-project-ba986d.es.us-central1.gcp.elastic.cloud:443,ES_API_KEY=V2VfQ0RKb0JMZW14WHRBTENhYWI6MW93UjJrZ2s1ZEVWcXdUdW1CVENEUQ==,ES_INDEX=mb_blends_v1'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'

images:
  - 'gcr.io/$PROJECT_ID/moverse-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/moverse-api:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
