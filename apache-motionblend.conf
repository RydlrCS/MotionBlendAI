# Apache Configuration for www.rydlr.com/motionblend
# Place this in your Apache configuration or .htaccess file

# Location for API endpoints at /motionblend
<Location /motionblend>
    # Proxy to the Python API server
    ProxyPass http://localhost:8080
    ProxyPassReverse http://localhost:8080
    
    # CORS Headers
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    Header always set Access-Control-Max-Age "3600"
    
    # Handle OPTIONS preflight requests
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]
</Location>

# Alternative: If deploying static UI files to /public_html/motionblend/ui
<Directory /home/rydlr/public_html/motionblend/ui>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Enable React Router (SPA) support
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /motionblend/ui/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /motionblend/ui/index.html [L]
    </IfModule>
</Directory>

# Required Apache modules:
# - mod_proxy
# - mod_proxy_http
# - mod_headers
# - mod_rewrite
#
# Enable with:
# a2enmod proxy proxy_http headers rewrite
# systemctl restart apache2
